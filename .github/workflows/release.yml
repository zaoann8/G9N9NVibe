name: Build & Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（留空则读取 VERSION 文件，例如 1.0.0）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build Universal macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(cat VERSION | tr -d '[:space:]')"
          fi
          TAG="v${VER}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # 同步版本号与 GitHub 仓库地址至 VERSION 与 Info.plist（使打包后的 App 天然支持在线检查与一键自动更新）
          echo "${VER}" > VERSION
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VER}" Packaging/Info.plist
          /usr/libexec/PlistBuddy -c "Set :G9NVibeGitHubRepo ${GITHUB_REPOSITORY}" Packaging/Info.plist
          echo "Resolved version: ${VER} (tag: ${TAG}, repo: ${GITHUB_REPOSITORY})"

      - name: Run automated self-tests (Protocol + 22 Core Cases)
        shell: bash
        run: |
          chmod +x Scripts/*.sh DriverSource/build-driver.sh
          ./Scripts/run-self-tests.sh

      - name: Build Universal App & Package DMG (Apple Silicon + Intel)
        shell: bash
        env:
          BUILD_UNIVERSAL: "1"
        run: |
          ./Scripts/build-dmg.sh
          VER="${{ steps.meta.outputs.version }}"
          DMG="dist/G9NVibe-${VER}.dmg"
          ls -lh "$DMG"
          lipo -info "dist/build/G9NVibe.app/Contents/MacOS/G9N9NVibe"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          echo "${SHA}  G9NVibe-${VER}.dmg" > "${DMG}.sha256"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "dmg_path=${DMG}" >> "$GITHUB_OUTPUT"
        id: pkg

      - name: Upload DMG build artifact
        uses: actions/upload-artifact@v4
        with:
          name: G9NVibe-${{ steps.meta.outputs.version }}-macOS-DMG
          path: |
            dist/G9NVibe-${{ steps.meta.outputs.version }}.dmg
            dist/G9NVibe-${{ steps.meta.outputs.version }}.dmg.sha256
            dist/G9NVibe.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: G9NVibe ${{ steps.meta.outputs.tag }}
          files: |
            dist/G9NVibe-${{ steps.meta.outputs.version }}.dmg
            dist/G9NVibe-${{ steps.meta.outputs.version }}.dmg.sha256
            dist/G9NVibe.dmg
          body: |
            ## G9NVibe ${{ steps.meta.outputs.tag }} (macOS Universal · Apple Silicon & Intel)

            把 Google Chromecast (`G9N9N`) 语音遥控器变成 macOS 原生 **Vibe Coding 实体声控与快捷键控制器**。

            ### 下载与校验
            - **版本特定安装包**：`G9NVibe-${{ steps.meta.outputs.version }}.dmg`
            - **永久最新直链通用包**：`G9NVibe.dmg`（永远自动指向本最新 Release，无需在外部链接中固定版本号）
            - **SHA-256**：`${{ steps.pkg.outputs.sha256 }}`

            ---

            ### ⚠️ 首次打开说明（免费开源 Ad-Hoc 签名，无 Apple 开发者账号）

            本项目为个人开源免费软件，当前采用 **Ad-Hoc 本地签名**（未购买 Apple $99/年开发者公证账号）。从 GitHub 下载 DMG 并拖入「应用程序」后，首次打开时 macOS Gatekeeper 会弹出 **「无法验证开发者」** 或 **「已损坏 / 无法打开」** 提示，属于正常现象，任选以下任意一种方式放行一次即可永久正常使用：

            - **方式一（推荐 · 图形界面点一下）**：
              1. 先尝试打开一次 `G9NVibe.app`，看到系统拦截弹窗后点「完成 / 取消」；
              2. 打开 **系统设置 → 隐私与安全性**，滑到最底部安全区域，点击 **`仍要打开`** 并输入密码/触控 ID 确认即可。
            - **方式二（终端一行命令，3 秒搞定）**：
              将 `G9NVibe.app` 拖入「应用程序」文件夹后，在终端执行：
              ```bash
              xattr -cr /Applications/G9NVibe.app
              ```
              然后直接双击打开即可。

            ---

            ### 核心特性
            - **系统麦永不常驻接管**：平时待机绝不亮橙色麦克风灯、不拖垮 AirPods 听歌音质；支持 **仅电脑麦 / 智能随动 / 仅遥控器麦 / 双麦合并** 与 **一键关闭双麦**。
            - **遥控器真实电量与 3 档灵敏度**：原生读取 G9N9N 蓝牙电池服务（`0x180F`）电量；内置 **近场 +14dB / 标准 +20dB / 远场 +26dB** 三档实时 DSP 增益与软限幅。
            - **15 键短按 + 8 键长按扩展**：36 项内置 Vibe Coding 与办公动作 + 任意原位录键；长按双功能与自动场景均拥有独立宽敞配置页。
            - **随前台应用自动切换预设**：在 Cursor / VS Code / Antigravity / Xcode / 终端与浏览器 / 办公应用间自动无损切换独立键位档案。

      - name: Auto Sync Website Version & Config
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          DMG_SIZE_MB="$(du -m "dist/G9NVibe-${VER}.dmg" | awk '{print $1}')"

          python3 -c "
          import re
          path = 'docs/index.html'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          content = re.sub(r'<span class=\"brand-ver\">v[0-9.]+</span>', f'<span class=\"brand-ver\">{TAG}</span>', content)
          content = re.sub(r'免费下载 v[0-9.]+ macOS DMG \([0-9.]+ MB\)', f'免费下载 {TAG} macOS DMG ({DMG_SIZE_MB} MB)', content)
          content = re.sub(r'Download v[0-9.]+ macOS DMG \([0-9.]+ MB\)', f'Download {TAG} macOS DMG ({DMG_SIZE_MB} MB)', content)
          content = re.sub(r'releases/download/v[0-9.]+/G9NVibe-[0-9.]+\.dmg', f'releases/download/{TAG}/G9NVibe-{VER}.dmg', content)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)

          readme_path = 'README.md'
          with open(readme_path, 'r', encoding='utf-8') as f:
              readme = f.read()
          readme = re.sub(r'releases/download/v[0-9.]+/G9NVibe-[0-9.]+\.dmg', f'releases/download/{TAG}/G9NVibe-{VER}.dmg', readme)
          with open(readme_path, 'w', encoding='utf-8') as f:
              f.write(readme)
          print('Successfully updated docs/index.html & README.md for ' + TAG)
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html README.md VERSION Packaging/Info.plist || true
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(release): 自动同步发布版本 $TAG 至官网与配置文件 [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME:-main} || true
          fi
